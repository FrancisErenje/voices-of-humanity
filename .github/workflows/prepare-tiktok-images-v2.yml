name: Prepare TikTok Images V2

on:
  push:
    paths:
      - .github/workflows/prepare-tiktok-images-v2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize images for TikTok
        env:
          REF_URL: https://static.metricool.com/planner/202609/7093598-file-8973393282993607915.jpeg
          BRIEF_URL: https://static.metricool.com/planner/202609/7093598-file-10220949736165391383.jpeg
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import os, urllib.request
          from PIL import Image
          from io import BytesIO
          items = [("ref062", os.environ["REF_URL"]), ("brief0930", os.environ["BRIEF_URL"])]
          os.makedirs("tiktok-ready", exist_ok=True)
          for name, url in items:
              data = urllib.request.urlopen(url, timeout=60).read()
              im = Image.open(BytesIO(data)).convert("RGB")
              im.thumbnail((1080, 1080), Image.Resampling.LANCZOS)
              im.save(f"tiktok-ready/{name}.jpg", "JPEG", quality=92, optimize=True)
          PY
      - name: Commit resized images
        run: |
          git config user.name "Voices of Humanity Automation"
          git config user.email "automation@voicesofhumanity.local"
          git add tiktok-ready/*.jpg
          git commit -m "Prepare September 30 posts for TikTok" || exit 0
          git push
